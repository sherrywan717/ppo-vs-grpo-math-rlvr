[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-rlvr"
version = "0.1.0"
description = "A reproducible PPO versus GRPO study for few-shot mathematical RLVR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.10,<2",
  "datasets>=4.0,<5",
  "math-verify==0.9.0",
  "peft>=0.17,<1",
  "PyYAML>=6.0.2,<7",
  "safetensors>=0.5,<1",
  "torch>=2.8,<2.9",
  "transformers>=4.55,<5",
  "trl==0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
math-rlvr-ppo = "math_rlvr.training.ppo:main"
math-rlvr-grpo = "math_rlvr.training.grpo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
