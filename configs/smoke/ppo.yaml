experiment:
  name: smoke-ppo-qwen-coder-0.5b
  algorithm: ppo
  seed: 42
model:
  name_or_path: Qwen/Qwen2.5-Coder-0.5B-Instruct
  dtype: bfloat16
  use_qlora: false
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
data:
  max_train_samples: 32
  max_eval_samples: 16
generation:
  max_new_tokens: 128
  temperature: 0.7
training:
  max_steps: 5
  per_device_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  save_steps: 5
  save_total_limit: 1
budget:
  max_gpu_hours: 0.25
  max_estimated_cost_cny: 5

