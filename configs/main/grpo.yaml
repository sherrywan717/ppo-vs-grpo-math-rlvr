experiment:
  name: main-grpo-qwen-coder-1.5b
  algorithm: grpo
  seed: 42
model:
  name_or_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
  dtype: bfloat16
  use_qlora: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
data:
  max_train_samples: 2000
  max_eval_samples: 200
generation:
  max_new_tokens: 512
  temperature: 0.7
  num_generations: 4
training:
  max_steps: 500
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  save_steps: 100
  save_total_limit: 2
budget:
  max_gpu_hours: 8
  max_estimated_cost_cny: 160

